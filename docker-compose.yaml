services:
  tictactoe:
    build: .
    stdin_open: true   # keep stdin open for `input()` prompts
    tty: true           # allocate a tty so the CLI prints/reads cleanly
    volumes:
      - .:/app           # mount source so code edits don't require a rebuild
    command: ["--x", "human", "--o", "human"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]